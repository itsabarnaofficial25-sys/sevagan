  <!-- Razorpay script -->
  <script>
    window.openRazorpayCheckout = function (options, onSuccess, onError) {
      function initRazorpay() {
        if (typeof Razorpay === 'undefined') {
          onError('Razorpay SDK not available.');
          return;
        }
        var rzp = new Razorpay({
          key: options.key,
          amount: options.amount,
          currency: options.currency || 'INR',
          order_id: options.order_id,
          name: options.name,
          description: options.description,
          prefill: {
            contact: options.contact,
            email: options.email
          },
          theme: { color: '#1565C0' },
          handler: function (response) {
            onSuccess(response.razorpay_payment_id, response.razorpay_signature);
          },
          modal: {
            ondismiss: function () {
              onError('Payment cancelled');
            }
          }
        });
        rzp.open();
      }
      if (typeof Razorpay !== 'undefined') {
        initRazorpay();
      } else {
        var script = document.createElement('script');
        script.src = 'https://checkout.razorpay.com/v1/checkout.js';
        script.onload = initRazorpay;
        script.onerror = function () {
          onError('Failed to load Razorpay SDK');
        };
        document.head.appendChild(script);
      }
    };
  </script>
