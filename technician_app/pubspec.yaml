name: technician_app
description: Sevagan Technician mobile application
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.1.2
  dio: ^5.4.0

  # Storage
  shared_preferences: ^2.2.2
  firebase_app_check: ^0.4.5

  # Maps & Location
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.1

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  firebase_messaging: ^16.2.2

  # UI Components & Utils
  cupertino_icons: ^1.0.6
  intl: 0.20.2
  image_picker: ^1.0.5
  permission_handler: ^11.1.0
  url_launcher: ^6.2.2
  flutter_local_notifications: ^17.0.0
  fluttertoast: ^8.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.10

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/sevagan.png"      # Main icon
  min_sdk_android: 21
  adaptive_icon_background: "#ffffff"
  adaptive_icon_foreground: "assets/icon/sevagan.png"   # Changed from logo.png

#flutter_native_splash:
#  color: "#ffffff"
#  image: assets/icon/sevagan.png             # Added splash config
#  android: true
#  ios: true
#  android_12:
#    image: assets/icon/sevagan.png
#    color: "#ffffff"

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icon/sevagan.png                # Only keep existing files
    # - assets/logo.png      (removed - file doesn't exist)
    - assets/sevagan.jpg  